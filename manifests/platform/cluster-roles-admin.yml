apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-admin-access-role
  labels:
    app.kubernetes.io/part-of: rhas-platform
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources:
      - serviceaccounts
    verbs:
      - get
      - list
      - watch
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pipelines-admin-access-role
  labels:
    app.kubernetes.io/part-of: rhas-platform
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: ["tekton.dev"]
    resources:
      - pipelines
      - pipelineruns
      - taskruns
    verbs:
      - get
      - list
      - watch
      - delete
      - create
      - update
      - patch
  - apiGroups: ["pipelinesascode.tekton.dev"]
    resources:
      - repositories
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
