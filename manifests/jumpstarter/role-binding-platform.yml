apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jumpstarter-access-role
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: ["jumpstarter.dev"]
    resources:
      - clients
      - exporteraccesspolicies
      - exporters
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups: [""]
    resources:
      - secrets
      - configmaps
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jumpstarter-access-role-jumpstarter-users
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: jumpstarter-access-role
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: jumpstarter-users
