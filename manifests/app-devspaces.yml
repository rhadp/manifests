apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: "auto-devspaces"
  namespace: "openshift-gitops"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: rhas
  revisionHistoryLimit: 3
  source:
    path: manifests/devspaces
    repoURL:  "https://github.com/rhadp/manifests"
    targetRevision: "main"
  destination:
    namespace: "auto-devspaces"
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 10m
